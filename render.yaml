# Render deployment config for HoloReconstruct
services:
  - type: web
    name: holoreconstruct
    runtime: python
    plan: free
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install numpy pillow fastapi "uvicorn[standard]" python-multipart pydantic
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
